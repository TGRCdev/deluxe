[package]
name = "deluxe-tg"
version = "0.5.0-DONOTUSE.2"
edition = "2021"
description = "Vendored version of deluxe for `bevy-butler`, due to cargo not supporting nested workspaces."
license = "MIT"
documentation = "https://docs.rs/deluxe"
homepage = "https://github.com/jf2048/deluxe"
repository = "https://github.com/jf2048/deluxe.git"
readme = "README.md"
include = ["/src", "/tests", "/README.md", "/COPYING"]
resolver = "2"

[features]
default = ["full", "proc-macro"]
full = ["deluxe-core/full", "syn/full"]
proc-macro = ["deluxe-core/proc-macro", "syn/proc-macro"]

[dependencies]
once_cell = "1.13.0"
proc-macro2 = "1.0.38"
syn = { version = "2.0.10", default-features = false }
deluxe-core = { path = "./core", version = "0.5.0-DONOTUSE.2", default-features = false, package = "deluxe-core-tg" }
deluxe-macros = { path = "./macros", version = "0.5.0-DONOTUSE.2", package = "deluxe-macros-tg" }

[dev-dependencies]
quote = "1.0.25"
deluxe-core = { path = "./core", version = "0.5.0-DONOTUSE.2", features = ["full"], default-features = false, package = "deluxe-core-tg" }

[workspace]
members = ["core", "macros"]
